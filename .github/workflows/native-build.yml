name: Native build (libblender.so)

# Goal: cross-compile Blender 3.6 Android port from source so we can patch the
# engine natively (multitask fix, GLES optimizations) instead of relying on
# the prebuilt libblender.so extracted from upstream release APK.
#
# Flow (mirrors the author's Doc/Compile Flow but fully automated):
#   1. Host x86_64 build of makesdna (upstream generates DNA/RNA on the build
#      machine; both host x86_64 and arm64 targets are LP64, safe to consume
#      cross). The author replaced these tools with static libs for on-device
#      helper apps; the executables are restored in this branch.
#   2. DNA files generated; RNA tools built + rna files generated.
#   3. Full arm64-v8a build (NDK r21e) with ccache to survive multi-run work.
#   4. libblender.so + bf_*.a uploaded as artifacts.

on:
  push:
    branches: [ opt/native-build ]
  workflow_dispatch:

env:
  NDK_VERSION: android-ndk-r21e  # NDK 21.4.7075529 used by the author

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Blender source
        uses: actions/checkout@v4
        with:
          path: Blender-android_arm64

      - name: Checkout lib-android_arm64 (third-party prebuilt deps)
        uses: actions/checkout@v4
        with:
          repository: binhmod/lib-android_arm64
          ref: main
          path: lib-android_arm64

      - name: Fix libpng headers (pnglibconf.h is build-generated; use prebuilt)
        run: |
          PNGD=lib-android_arm64/Png/include/libpng-1.6.40
          cp "$PNGD/scripts/pnglibconf.h.prebuilt" "$PNGD/pnglibconf.h"
          ls -l lib-android_arm64/Png/include/libpng-1.6.40/png*.h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libpng-dev
          ninja --version
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: blender-ccache-${{ github.ref }}
          restore-keys: blender-ccache-

      - name: Download NDK r21e
        run: |
          if [ ! -d "$HOME/${NDK_VERSION}" ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/${NDK_VERSION}-linux-x86_64.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          ls "$HOME/${NDK_VERSION}" >/dev/null

      # ---- HOST tools (makesdna / makesrna) ----
      - name: Host configure (no cross toolchain)
        run: |
          set -o pipefail
          cmake \
            -G Ninja \
            -B build_host \
            -S Blender-android_arm64 \
            -DBLENDER_MOBILE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure_host.log

      - name: Host build makesdna + generate DNA
        run: |
          set -o pipefail
          cmake --build build_host --target makesdna 2>&1 | tee build_makesdna.log
          MD_BIN=build_host/bin/makesdna
          mkdir -p dna_out build/source/blender/makesdna/intern build_host/source/blender/makesdna/intern
          "$MD_BIN" dna_out/dna.c dna_out/dna_type_offsets.h dna_out/dna_verify.c \
            "$GITHUB_WORKSPACE/Blender-android_arm64/source/blender/makesdna/"
          cp dna_out/* build/source/blender/makesdna/intern/
          cp dna_out/* build_host/source/blender/makesdna/intern/
          ls -lh dna_out

      - name: Host build makesrna + generate RNA
        id: gen_rna
        run: |
          set -o pipefail
          cmake --build build_host --target makesrna 2>&1 | tee build_makesrna.log
          MR_BIN=build_host/bin/makesrna
          mkdir -p build/source/blender/makesrna/intern build/source/blender/makesrna
          # NOTE: makesrna concatenates outfile + filename, so both dirs need a
          # trailing slash (upstream usage: outdirectory/ [public_header_dir]/).
          "$MR_BIN" build/source/blender/makesrna/intern/ build/source/blender/makesrna/
          ls build/source/blender/makesrna/intern | head -30

      # Build-time helper tools (datatoc, datatoc_icon) must exist as HOST
      # executables: ninja calls them to bake datafiles (icons etc). We build
      # the ARM variants once in the cross config, then overwrite them with
      # host x86_64 binaries at the same path ($<TARGET_FILE:...>).
      - name: Build datatoc tools for host
        run: |
          mkdir -p hosttools
          gcc Blender-android_arm64/source/blender/datatoc/datatoc.c -o hosttools/datatoc
          # datatoc_icon swaps bytes based on __LITTLE_ENDIAN__ (CMake adds it
          # via add_definitions for MSVC/OSX/TestBigEndian; raw gcc needs it).
          gcc -D__LITTLE_ENDIAN__ Blender-android_arm64/source/blender/datatoc/datatoc_icon.c -o hosttools/datatoc_icon -lpng -lm
          g++ Blender-android_arm64/extern/smaa_areatex/smaa_areatex.cpp -o hosttools/smaa_areatex
          # ---- host msgfmt (standalone, minimal blenlib + stubs) ----
          mkdir -p hosttools hostinc
          echo '' | base64 -d > hostinc/DNA_vec_types.h
          echo 'I3ByYWdtYSBvbmNlCnR5cGVkZWYgc3RydWN0IExpc3RCYXNlIHsgdm9pZCAqZmlyc3QsICpsYXN0OyB9IExpc3RCYXNlOwp0eXBlZGVmIHN0cnVjdCBMaW5rIHsgc3RydWN0IExpbmsgKm5leHQsICpwcmV2OyB9IExpbms7CnR5cGVkZWYgc3RydWN0IExpbmtEYXRhIHsgc3RydWN0IExpbmtEYXRhICpuZXh0OyB2b2lkICpkYXRhOyB9IExpbmtEYXRhOwo=' | base64 -d > hostinc/DNA_listBase.h
          echo '' | base64 -d > hosttools/shims.c
          echo 'aW50IGxlYWtfZGV0ZWN0b3JfaGFzX3J1biA9IDA7CmNoYXIgZnJlZV9hZnRlcl9sZWFrX2RldGVjdGlvbl9tZXNzYWdlW10gPSAiRXJyb3I6IE5vdCBmcmVlZCBtZW1vcnkgYmxvY2tzLi4uIjsK' | base64 -d > hosttools/shims2.c
          BLIB=Blender-android_arm64/source/blender/blenlib
          gcc -w -I hostinc -I $BLIB -I $BLIB/intern -I Blender-android_arm64/intern/guardedalloc -I Blender-android_arm64/intern/atomic \
            Blender-android_arm64/source/blender/blentranslation/msgfmt/msgfmt.c \
            $BLIB/intern/BLI_dynstr.c $BLIB/intern/BLI_ghash.c $BLIB/intern/BLI_ghash_utils.c \
            $BLIB/intern/BLI_memarena.c $BLIB/intern/BLI_mempool.c $BLIB/intern/BLI_assert.c \
            $BLIB/intern/string.c $BLIB/intern/hash_mm2a.c $BLIB/intern/system.c $BLIB/intern/listbase.cc \
            Blender-android_arm64/intern/guardedalloc/intern/mallocn.c \
            Blender-android_arm64/intern/guardedalloc/intern/mallocn_guarded_impl.c \
            Blender-android_arm64/intern/guardedalloc/intern/mallocn_lockfree_impl.c \
            Blender-android_arm64/intern/guardedalloc/intern/memory_usage.cc \
            hosttools/shims.c hosttools/shims2.c -lstdc++ -lm -lpthread -o hosttools/msgfmt
          ./hosttools/datatoc Blender-android_arm64/source/blender/datatoc/datatoc.c /tmp/_smoke.txt && wc -c /tmp/_smoke.txt
          ./hosttools/msgfmt 2>&1 | head -1
          echo host-datatoc-ok

      # ---- ARM64 full build ----
      - name: Configure arm64
        run: |
          set -o pipefail
          cmake \
            -G Ninja \
            -B build \
            -S Blender-android_arm64 \
            -DBLENDER_MOBILE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure_arm.log

      - name: Swap in host datatoc tools
        run: |
          set -o pipefail
          cmake --build build --target datatoc datatoc_icon msgfmt smaa_areatex 2>&1 | tee build_datatoc_arm.log || true
          cp -f hosttools/datatoc build/bin/datatoc
          cp -f hosttools/datatoc_icon build/bin/datatoc_icon
          cp -f hosttools/msgfmt build/bin/msgfmt
          cp -f hosttools/smaa_areatex build/bin/smaa_areatex
          file build/bin/datatoc build/bin/datatoc_icon build/bin/msgfmt build/bin/smaa_areatex

      - name: Build arm64 (full)
        id: build_arm
        continue-on-error: true
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/ccache"
          export CCACHE_MAXSIZE=5G
          ccache --zero-stats || true
          cmake --build build -j4 2>&1 | tee build_arm.log
          ccache --show-stats || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: blender-ccache-${{ github.ref }}-${{ github.run_id }}

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-outputs
          path: |
            build_arm.log
            build_datatoc_arm.log
            build/lib/*.a
            build/lib/**/*.a
            build/bin/*.so
            build/bin/libblender.so
          if-no-files-found: ignore

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-arm-logs
          path: |
            configure_arm.log
            build_arm.log
            configure_host.log
            build_makesdna.log
            build_makesrna.log
            dna_out/*
          if-no-files-found: ignore
