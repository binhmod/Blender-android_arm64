name: Native build probe (libblender.so)

# Goal: cross-compile Blender 3.6 Android port from source so we can patch the
# engine natively (multitask fix, GLES optimizations) instead of relying on
# the prebuilt libblender.so extracted from upstream release APK.
#
# Author layout requirement:
#   BLENDER_MOBILE_DIR/  <- defined as workspace root
#     Blender-android_arm64/  (this checkout)
#     lib-android_arm64/      (prebuilt third-party deps)
#
# The custom-commands that run makesdna/makesrna are already commented-out in
# this tree. Upstream Blender generates DNA/RNA on the build machine and this
# is safe to cross-consume (both x86_64 host and arm64 target are LP64).
# Only the author replaced the tool EXECUTABLES with STATIC LIBRARIES
# (for their on-device helper apps); we restored the executables.
#
# Milestones:
#   1. host configure/build of makesdna (DONE)
#   2. host build of makesrna + DNA/RNA generation (CURRENT)
#   3. full arm64 build with generated files (NEXT)
#
# NOTE: arm64 NDK binaries cannot run under qemu-user on the runner because
# bionic's ELF interpreter is /system/bin/linker64 - hence the host tools.

on:
  push:
    branches: [ opt/native-build ]
  workflow_dispatch:

env:
  NDK_VERSION: android-ndk-r21e  # NDK 21.4.7075529 used by the author

jobs:
  native-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blender source
        uses: actions/checkout@v4
        with:
          path: Blender-android_arm64

      - name: Checkout lib-android_arm64 (third-party prebuilt deps)
        uses: actions/checkout@v4
        with:
          repository: binhmod/lib-android_arm64
          ref: main
          path: lib-android_arm64

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ninja --version

      - name: Download NDK r21e (for later full arm64 build)
        run: |
          if [ ! -d "$HOME/${NDK_VERSION}" ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/${NDK_VERSION}-linux-x86_64.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          ls "$HOME/${NDK_VERSION}" >/dev/null

      # ---- HOST tools (makesdna / makesrna) ----
      - name: Host configure (no cross toolchain)
        run: |
          set -o pipefail
          cmake \
            -G Ninja \
            -B build_host \
            -S Blender-android_arm64 \
            -DBLENDER_MOBILE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure_host.log

      - name: Host build makesdna
        run: |
          set -o pipefail
          cmake --build build_host --target makesdna 2>&1 | tee build_makesdna.log

      - name: Generate DNA files (host)
        run: |
          MD_BIN=build_host/bin/makesdna
          ls -l "$MD_BIN"
          mkdir -p dna_out build/source/blender/makesdna/intern
          "$MD_BIN" \
            dna_out/dna.c dna_out/dna_type_offsets.h dna_out/dna_verify.c \
            "$GITHUB_WORKSPACE/Blender-android_arm64/source/blender/makesdna/"
          cp dna_out/* build/source/blender/makesdna/intern/
          mkdir -p build_host/source/blender/makesdna/intern
          cp dna_out/* build_host/source/blender/makesdna/intern/
          ls -lh dna_out build/source/blender/makesdna/intern

      - name: Host build makesrna
        id: build_makesrna
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build_host --target makesrna 2>&1 | tee build_makesrna.log

      - name: Generate RNA files (host)
        id: gen_rna
        if: steps.build_makesrna.outcome == 'success'
        continue-on-error: true
        run: |
          MR_BIN=build_host/bin/makesrna
          ls -l "$MR_BIN"
          mkdir -p build/source/blender/makesrna/intern build/source/blender/makesrna
          "$MR_BIN" \
            build/source/blender/makesrna/intern build/source/blender/makesrna
          ls build/source/blender/makesrna/intern | head -30

      # ---- ARM64 configure sanity (uses the DNA/RNA generated above) ----
      - name: Configure arm64 cross build
        if: steps.gen_rna.outcome != 'skipped'
        run: |
          set -o pipefail
          cmake \
            -G Ninja \
            -B build \
            -S Blender-android_arm64 \
            -DBLENDER_MOBILE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure_arm.log

      - name: Upload logs & generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-logs
          path: |
            configure_host.log
            configure_arm.log
            build_makesdna.log
            build_makesrna.log
            dna_out/*
            build/source/blender/makesrna/intern/
          if-no-files-found: ignore
