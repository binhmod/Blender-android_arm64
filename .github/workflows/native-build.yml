name: Native build probe (libblender.so)

# Goal: cross-compile Blender 3.6 Android port from source so we can patch the
# engine natively (multitask fix, GLES optimizations) instead of relying on
# the prebuilt libblender.so extracted from upstream release APK.
#
# Author layout requirement:
#   BLENDER_MOBILE_DIR/  <- defined as workspace root
#     Blender-android_arm64/  (this checkout)
#     lib-android_arm64/      (prebuilt third-party deps)
#
# The custom-commands that run makesdna/makesrna are already commented-out in
# this tree (author's manual flow generated them on the Android device).
# On CI we instead:
#   1. build makesdna as an arm64v8a binary via the NDK cross toolchain
#   2. run it under qemu-user-aarch64 on the x86_64 runner to generate dna.c / ...
#   3. place the generated files into the build dir like the author's manual flow
#
# Current milestone: make makesdna + makesrna build & run. Full bf libs build
# comes after this one is green.

on:
  push:
    branches: [ opt/native-build ]
  workflow_dispatch:

env:
  NDK_VERSION: android-ndk-r21e  # NDK 21.4.7075529 used by the author

jobs:
  native-configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blender source
        uses: actions/checkout@v4
        with:
          path: Blender-android_arm64

      - name: Checkout lib-android_arm64 (third-party prebuilt deps)
        uses: actions/checkout@v4
        with:
          repository: binhmod/lib-android_arm64
          ref: main
          path: lib-android_arm64

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qemu-user
          ninja --version

      - name: Download NDK r21e
        run: |
          if [ ! -d "$HOME/${NDK_VERSION}" ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/${NDK_VERSION}-linux-x86_64.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          ls "$HOME/${NDK_VERSION}"

      - name: Configure (cross arm64-v8a)
        id: configure
        run: |
          set -o pipefail
          cmake \
            -G Ninja \
            -B build \
            -S Blender-android_arm64 \
            -DBLENDER_MOBILE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Build makesdna (arm64)
        id: build_makesdna
        run: |
          set -o pipefail
          cmake --build build --target makesdna 2>&1 | tee build_makesdna.log

      - name: Generate DNA files under qemu-user
        id: gen_dna
        run: |
          SYSROOT_LIB="$HOME/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/28"
          MD_BIN=build/source/blender/makesdna/makesdna
          ls -l "$MD_BIN"
          mkdir -p /tmp/mkdna build/source/blender/makesdna/intern
          qemu-aarch64 -L "$SYSROOT_LIB" "$MD_BIN" \
            /tmp/mkdna/dna.c /tmp/mkdna/dna_type_offsets.h /tmp/mkdna/dna_verify.c \
            "$GITHUB_WORKSPACE/Blender-android_arm64/source/blender/makesdna/"
          cp /tmp/mkdna/* build/source/blender/makesdna/intern/
          ls -lh /tmp/mkdna build/source/blender/makesdna/intern

      - name: Build makesrna (arm64)
        id: build_makesrna
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --target makesrna 2>&1 | tee build_makesrna.log

      - name: Generate RNA files under qemu-user
        id: gen_rna
        if: steps.build_makesrna.outcome == 'success'
        continue-on-error: true
        run: |
          SYSROOT_LIB="$HOME/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/28"
          MR_BIN=build/source/blender/makesrna/makesrna
          ls -l "$MR_BIN"
          mkdir -p build/source/blender/makesrna/intern
          qemu-aarch64 -L "$SYSROOT_LIB" "$MR_BIN" \
            build/source/blender/makesrna/intern build/source/blender/makesrna
          ls -lh build/source/blender/makesrna/intern build/source/blender/makesrna | head -30

      - name: Upload logs & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-logs
          path: |
            configure.log
            build_makesdna.log
            build_makesrna.log
            build/CMakeFiles/CMakeError.log
            build/source/blender/makesdna/intern/dna.c
            build/source/blender/makesdna/intern/dna_verify.c
            build/source/blender/makesrna/intern/*.h
          if-no-files-found: ignore

      - name: Upload build directory (cache for next milestone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: build
          if-no-files-found: ignore
